commands:
  install_backend: cargo check
  install_frontend: cd frontend && bun install
  typecheck: cargo check
  build: cargo build --release
  build_frontend: cd frontend && bun run build
  test: cargo test --features test-utils
  test_frontend: cd frontend && bun run test
  lint: cargo fmt --check && cargo clippy -- -D warnings
  fmt: cargo fmt

services:
  postgres:
    start: docker compose up -d postgres
    stop: docker compose stop postgres
    healthcheck: docker compose exec -T postgres pg_isready -U prefixd
    port: 5432
    depends_on: []

  gobgp:
    start: docker compose up -d gobgp
    stop: docker compose stop gobgp
    healthcheck: docker compose ps gobgp --format '{{.Status}}' | grep -q Up
    port: 50051
    depends_on: []

  prefixd:
    start: docker compose up -d prefixd
    stop: docker compose stop prefixd
    healthcheck: curl -sf http://localhost:8080/v1/health
    port: 8080
    depends_on: [postgres, gobgp]

  dashboard:
    start: docker compose up -d dashboard
    stop: docker compose stop dashboard
    healthcheck: curl -sf http://localhost:3000
    port: 3000
    depends_on: [prefixd]

  nginx:
    start: docker compose up -d nginx
    stop: docker compose stop nginx
    healthcheck: curl -sf http://localhost/v1/health
    port: 80
    depends_on: [prefixd, dashboard]

  full-stack:
    start: docker compose up -d
    stop: docker compose down
    healthcheck: curl -sf http://localhost/v1/health
    port: 80
    depends_on: []
